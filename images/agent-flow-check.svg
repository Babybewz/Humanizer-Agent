<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="1064" viewBox="0 0 1390 1064" role="img" font-family="Tahoma, 'Leelawadee UI', 'Noto Sans Thai', sans-serif">
<title>Flow การตรวจความเป็นมนุษย์ของ Agent check-humanity</title>
<desc>ผู้ใช้ส่งข้อความหรือไฟล์ Agent ถามก่อนเริ่มในข้อความเดียว ไม่เกิน 3 ข้อ ได้แก่ ทาง ช่วง และโหมด ถ้าเป็นข้อความ ทำในแชตทั้งสามทางและไม่สร้างไฟล์ ถ้าเป็นไฟล์ ดูโครงไฟล์ แล้วแยกเป็นสามทาง ทางตรวจ เลือกช่วง นักภาษาศาสตร์ตรวจ ได้ไฟล์รายงานที่ไม่มีช่องติ๊ก ทางตรวจและแก้ เลือกช่วงและโหมด ได้ไฟล์รายการ Before After ให้ติ๊ก ผู้ใช้เลือก Agent สรุปและถามยืนยัน แล้วสร้างไฟล์ Word แบบ Track Changes ทางเขียนใหม่ (rewrite) เลือกช่วงตั้งแต่หนึ่งหัวข้อถึงทั้งไฟล์และโหมด นักอ่านและนักภาษาศาสตร์สรุปเป็น brief ผู้ใช้ยืนยัน brief แล้วเขียนใหม่และสร้างไฟล์ preview ให้ผู้เขียนตรวจก่อน ผู้ใช้ติ๊ก section และยืนยัน จึงสร้างไฟล์ใหม่ที่ไม่มี Track Changes ไฟล์ทั้งหมดอยู่ใต้ HumanizerAgent\output ในโฟลเดอร์ Documents ไม่เขียนในโฟลเดอร์ของ skill</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1390" height="1064" fill="#FFFFFF"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#2C2C2A">การตรวจความเป็นมนุษย์ (check-humanity)</text>

<g font-size="14" text-anchor="middle">
<rect x="360" y="50" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="525" y="73" fill="#0C447C" font-weight="bold">ผู้ใช้ส่งงาน</text><text x="525" y="93" font-size="12" fill="#185FA5">วางข้อความ หรือระบุไฟล์ .docx .pdf .txt</text>
<rect x="360" y="138" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="525" y="161" fill="#3C3489" font-weight="bold">ถามก่อนเริ่ม ไม่เกิน 3 ข้อ</text><text x="525" y="181" font-size="12" fill="#534AB7">ถามรวมในข้อความเดียว: ทาง · ช่วง · โหมด</text>
<rect x="360" y="226" width="330" height="48" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="525" y="255" fill="#444441" font-weight="bold">ข้อความหรือไฟล์?</text>

<rect x="10" y="320" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="175" y="343" fill="#3C3489" font-weight="bold">ข้อความ: ทำในแชต</text><text x="175" y="363" font-size="12" fill="#534AB7">ทั้งสามทางอยู่ในแชต ไม่สร้างไฟล์</text>

<rect x="360" y="320" width="330" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="525" y="343" fill="#085041" font-weight="bold">ดูโครงไฟล์ (outline)</text><text x="525" y="363" font-size="12" fill="#0F6E56">extract-text · ยังไม่อ่านเนื้อหา</text>
<rect x="345" y="408" width="360" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="525" y="431" fill="#444441" font-weight="bold">เลือกทางที่ต้องการ</text><text x="525" y="451" font-size="12" fill="#5F5E5A">ตรวจ · ตรวจและแก้ · เขียนใหม่ (rewrite)</text>

<rect x="10" y="500" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="175" y="523" fill="#0C447C" font-weight="bold">ตรวจ: ผู้ใช้เลือกช่วง</text><text x="175" y="543" font-size="12" fill="#185FA5">หัวข้อ · ย่อหน้า · หน้า · ทั้งหมด</text>
<rect x="10" y="588" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="175" y="611" fill="#3C3489" font-weight="bold">นักภาษาศาสตร์ตรวจสำนวน</text><text x="175" y="631" font-size="12" fill="#534AB7">ยกข้อความจริง · ไม่ให้ % หรือคะแนน</text>
<rect x="10" y="676" width="330" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="175" y="699" fill="#633806" font-weight="bold">ไฟล์รายงาน</text><text x="175" y="719" font-size="12" fill="#854F0B">…_report_&lt;วันที่&gt;.md ไม่มีช่องติ๊ก</text>

<rect x="360" y="500" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="525" y="523" fill="#0C447C" font-weight="bold">ตรวจและแก้: เลือกช่วง + โหมด</text><text x="525" y="543" font-size="12" fill="#185FA5">คงระดับเดิม · ทางการ · พื้นฐาน</text>
<rect x="360" y="588" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="525" y="611" fill="#3C3489" font-weight="bold">นักภาษาศาสตร์ตรวจและเสนอแก้</text><text x="525" y="631" font-size="12" fill="#534AB7">แก้เฉพาะคำหรือวลีที่ชี้ · คงคำผูกมัด</text>
<rect x="360" y="676" width="330" height="56" rx="6" fill="#FAEEDA" stroke="#854F0B"/><text x="525" y="699" fill="#633806" font-weight="bold">ไฟล์รายการ + ช่องติ๊ก (R1, R2, …)</text><text x="525" y="719" font-size="12" fill="#854F0B">…_review_&lt;วันที่&gt;.md · before/after</text>
<rect x="360" y="764" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="525" y="787" fill="#0C447C" font-weight="bold">ผู้ใช้เลือกข้อที่จะแก้</text><text x="525" y="807" font-size="12" fill="#185FA5">ติ๊กแล้ว “ใช้ตามไฟล์” หรือพิมพ์ R1, R3</text>
<rect x="360" y="852" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="525" y="875" fill="#3C3489" font-weight="bold">Agent สรุปและถามยืนยัน</text><text x="525" y="895" font-size="12" fill="#534AB7">ไม่ตอบหรือข้าม = ไม่สร้างไฟล์</text>
<rect x="360" y="940" width="330" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="525" y="963" fill="#085041" font-weight="bold">สร้าง Word ฉบับปรับ (Track Changes)</text><text x="525" y="983" font-size="12" fill="#0F6E56">…_humanized_&lt;วันที่&gt;.docx · apply-revisions</text>

<rect x="710" y="500" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="875" y="523" fill="#0C447C" font-weight="bold">เขียนใหม่: เลือกช่วง + โหมด</text><text x="875" y="543" font-size="12" fill="#185FA5">หนึ่งหัวข้อถึงทั้งไฟล์ · โหมด</text>
<rect x="710" y="588" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="875" y="611" fill="#3C3489" font-weight="bold">นักอ่าน + นักภาษาศาสตร์</text><text x="875" y="631" font-size="12" fill="#534AB7">สรุปเป็น brief …_brief_&lt;วันที่&gt;.md</text>
<rect x="710" y="676" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="875" y="699" fill="#0C447C" font-weight="bold">ผู้ใช้ยืนยัน brief</text><text x="875" y="719" font-size="12" fill="#185FA5">ถูกต้อง · แก้ brief · ยกเลิก</text>
<rect x="710" y="764" width="330" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="875" y="787" fill="#3C3489" font-weight="bold">เขียนใหม่ แล้วตรวจ preview เอง</text><text x="875" y="807" font-size="12" fill="#534AB7">…_rewrite_&lt;วันที่&gt;.md · before/after</text>
<rect x="710" y="852" width="330" height="56" rx="6" fill="#E6F1FB" stroke="#185FA5"/><text x="875" y="875" fill="#0C447C" font-weight="bold">ผู้ใช้ติ๊ก section + ยืนยัน</text><text x="875" y="895" font-size="12" fill="#185FA5">ไม่ติ๊กหรือไม่ยืนยัน = ไม่สร้างไฟล์</text>
<rect x="710" y="940" width="330" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="875" y="963" fill="#085041" font-weight="bold">สร้างไฟล์ใหม่ ไม่มี Track Changes</text><text x="875" y="983" font-size="12" fill="#0F6E56">…_rewritten_&lt;วันที่&gt;.docx / .txt</text>
</g>

